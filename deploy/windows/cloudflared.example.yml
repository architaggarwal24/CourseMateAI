# The Cloudflare Tunnel for CourseMate on this PC (docs/deploy-windows.md). tunnel.ps1 writes cloudflared.yml from
# this with your tunnel id and hostname filled in.
#
# One hostname for everything: /api/* goes straight to the backend (no Next.js hop, so long AI answers and
# webhooks aren't proxied twice), every other path to the Next.js server. Same origin, so the login cookie is
# first-party and there is no CORS.
tunnel: __TUNNEL_ID__
credentials-file: __CREDENTIALS__

ingress:
  - hostname: __HOSTNAME__
    path: ^/api/
    service: http://127.0.0.1:8000
    originRequest:
      connectTimeout: 10s
  - hostname: __HOSTNAME__
    service: http://127.0.0.1:3000
  - service: http_status:404
